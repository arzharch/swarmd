apiVersion: 1

# uid is pinned rather than generated: dashboard JSON in this repo references
# these datasources by uid, so a generated one would break every panel on a
# fresh Grafana volume.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s

  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
