[project]
name = "swarmd"
version = "0.1.0"
description = "Multi-agent orchestration runtime: staged pipelines, checkpoint/resume recovery, quality gates, durable HITL, full tracing."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Arsh Zakee Chowhan" }]
dependencies = [
    # Phase 1 core is asyncio stdlib. Added per phase, each justified in an ADR:
    # Phase 2: httpx, asyncpg | Phase 4: none beyond stdlib for mock provider
    # Phase 6: opentelemetry-sdk, prometheus-client
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
]

[project.scripts]
swarmd = "swarmd.cli:main"

[project.optional-dependencies]
otel = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp>=1.25"]
metrics = ["prometheus-client>=0.20"]
# Cluster-wide rate-limit quota. Only needed when more than one process shares
# a provider credential -- i.e. the Kubernetes deployment (ADR-011).
redis = ["redis>=5.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    # Installed in dev so CI exercises the real metrics path, not only the
    # no-op fallback. A test that only ever runs the fallback proves nothing.
    "prometheus-client>=0.20",
]
serve = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "websockets>=13",
]

[build-system]
requires = ["uv_build>=0.7,<1.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.swarmd]
# examples/ is not an installed package (kernel purity, ADR-002); the CLI adds
# the repo root to sys.path at runtime so `swarmd leadops` can import it.


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
# Type-check against the DEPLOYMENT platform, not the development one.
# The container and CI both run Linux; checking as win32 hides POSIX-only
# code paths (setrlimit, killpg) behind sys.platform narrowing and reports
# them as undefined names, which is a false failure for correct code.
platform = "linux"

[[tool.mypy.overrides]]
module = ["asyncpg", "redis.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "httpx>=0.28",
    "prometheus-client>=0.20",
    "pytest-timeout>=2.4.0",
    "pyyaml>=6.0.3",
]
