# Observability + persistence stack for swarmd runs.

services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"   # UI
      - "4318:4318"     # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: swarmd
      POSTGRES_PASSWORD: swarmd_dev
      POSTGRES_DB: leadops
    ports:
      # Host port 5434 (NOT the default 5432/5433) so swarmd never collides with
      # other projects' Postgres instances on this machine. Inside the compose
      # network it's still plain 5432.
      - "5434:5432"
