---
# Redis holds ONLY the quota buckets (ADR-011). Nothing durable lives here:
# every bucket carries a 5-minute TTL, so losing the whole instance costs one
# window of over-permissiveness and nothing else. That is why persistence is
# disabled and why a single replica is acceptable where it would not be for a
# datastore.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swarmd-redis
  labels:
    app.kubernetes.io/name: swarmd-redis
spec:
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: two Redis pods behind one Service would
    # split the quota buckets in half and each would permit the full rate --
    # precisely the over-permissiveness the quota exists to prevent.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: swarmd-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: swarmd-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - 128mb
            # Buckets carry their own TTL, but a memory cap needs a policy or
            # Redis returns errors instead of evicting. volatile-lru is right
            # here because every key has a TTL by construction.
            - --maxmemory-policy
            - volatile-lru
          ports:
            - name: redis
              containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 192Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: swarmd-redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: swarmd-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
# kube-prometheus-stack CRDs. Scrape config and alert rules live beside the
# code they describe, so a metric rename and its alert change in one commit --
# rather than the alert silently going stale in a separate ops repo.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: swarmd
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: swarmd
      app.kubernetes.io/component: control-plane
  endpoints:
    - port: metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: swarmd-runs
  labels:
    release: kube-prometheus-stack
spec:
  # Run pods are Jobs with no Service, so they are scraped as pods. Without
  # this, everything a run does -- which is everything interesting -- is
  # invisible to Prometheus.
  selector:
    matchLabels:
      app.kubernetes.io/name: swarmd
      app.kubernetes.io/component: run
  podMetricsEndpoints:
    - port: metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: swarmd
  labels:
    release: kube-prometheus-stack
spec:
  # Mirrors observability/alerts.yml, which is what the local compose stack
  # loads. Kept in both places deliberately: local and cluster must alert the
  # same way, and CI checks they have not drifted apart.
  groups:
    - name: swarmd-capacity
      rules:
        - alert: SwarmdProviderPoolExhausted
          expr: max(swarmd_provider_available) == 0
          for: 2m
          labels: { severity: page, runbook: "RUNBOOK.md#providerpoolexhausted" }
          annotations:
            summary: "Every provider is backed off"
        - alert: SwarmdRateLimitRatioHigh
          expr: |
            sum(rate(swarmd_rate_limited_total[10m]))
              / clamp_min(sum(rate(swarmd_llm_calls_total[10m])), 0.001) > 0.10
          for: 10m
          labels: { severity: ticket, runbook: "RUNBOOK.md#ratelimitratiohigh" }
          annotations:
            summary: "Over 10% of calls are being rate limited"
    - name: swarmd-correctness
      rules:
        - alert: SwarmdRecoveryPathDead
          expr: |
            sum(rate(swarmd_agent_kills_total[10m])) > 0
              and sum(rate(swarmd_requeues_total[10m])) == 0
          for: 10m
          labels: { severity: page, runbook: "RUNBOOK.md#recoverypathdead" }
          annotations:
            summary: "Agents killed and nothing requeued -- recovery not running"
    - name: swarmd-cost
      rules:
        - alert: SwarmdCostCeilingApproaching
          expr: sum(swarmd_cost_usd_total) > 0.035
          for: 1m
          labels: { severity: ticket, runbook: "RUNBOOK.md#costceilingapproaching" }
          annotations:
            summary: "Run spend past 70% of the ceiling"
