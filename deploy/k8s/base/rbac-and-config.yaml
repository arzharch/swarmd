---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: swarmd
# The control plane creates Jobs; it does not need to read cluster state, so
# it does not get a token mounted by default. Anything that needs the API
# server asks for it explicitly.
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: swarmd-run-launcher
rules:
  # Exactly what is needed to launch and observe runs, and nothing else.
  # No secrets, no configmaps, no cluster scope. A control plane that can read
  # Secrets can exfiltrate every provider key in the namespace, and it has no
  # reason to -- its own keys arrive through envFrom at pod start.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: swarmd-run-launcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: swarmd-run-launcher
subjects:
  - kind: ServiceAccount
    name: swarmd
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: swarmd-config
data:
  # Redis presence is what switches quota from in-process buckets to
  # cluster-wide coordination (ADR-011). Multi-replica without this is the bug
  # that ADR exists to prevent, so it is set unconditionally in-cluster.
  SWARMD_REDIS_URL: "redis://swarmd-redis:6379/0"
  SWARMD_METRICS_PORT: "9464"
  SWARMD_COST_CEILING_USD: "0.05"
  SWARMD_OTEL_ENDPOINT: "http://otel-collector:4318"
  # Off by default. The Mistral free tier's quota is paid for in data -- see
  # ADR-006 and the capacity plan. Turning it on is a deliberate act, and doing
  # it here rather than in code means the decision is visible in a diff.
  SWARMD_ALLOW_DATA_TRAINING: "false"
  SWARMD_ALLOW_PAID: "false"
  # Disables interactive API docs, which are otherwise a live client for every
  # endpoint served without the operator token.
  SWARMD_ENV: "prod"
  SWARMD_LOG_FORMAT: "json"
  # NO USER AUTH, DELIBERATELY, and this is where that decision is visible in a
  # diff rather than implied by an unset variable. The container binds 0.0.0.0
  # because a pod must; without this the control plane refuses to start, which
  # is the intended behaviour for an accidental public bind.
  #
  # What makes it safe here is NOT the absence of a token. It is the
  # default-deny NetworkPolicy below: port 8000 admits the dashboard pod and
  # the ingress controller and nothing else. Remove that policy and this line
  # becomes an open run API that spends real provider quota.
  #
  # Setting SWARMD_API_TOKEN in the secret turns auth on and this line becomes
  # redundant; it is left out of MVP scope, not out of the design.
  SWARMD_ALLOW_OPEN: "1"
---
apiVersion: v1
kind: Secret
metadata:
  name: swarmd-provider-keys
  annotations:
    # PLACEHOLDER ONLY. Real environments replace this with an
    # ExternalSecret (AWS Secrets Manager / Azure Key Vault) -- see
    # deploy/k8s/overlays/prod. Committing real keys, even base64'd, would put
    # them in git history forever, where rotation cannot reach them.
    swarmd.dev/managed-by: "replace-with-external-secrets-operator"
type: Opaque
stringData:
  # Gates every mutating endpoint and the event stream. Not user auth: one
  # principal, one credential (ADR-013). The app refuses to start bound
  # off-host without it.
  SWARMD_API_TOKEN: ""
  GROQ_API_KEY: ""
  GOOGLE_API_KEY: ""
  CEREBRAS_API_KEY: ""
  OPENROUTER_API_KEY: ""
  DATABASE_URL: ""
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: swarmd-default-deny
spec:
  # Default deny, then allow explicitly. The opposite order means every new
  # workload is exposed until someone remembers to restrict it, and nobody
  # remembers.
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: swarmd-control-plane
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: swarmd
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: frontend
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9464
  egress:
    # DNS, or nothing else in this list resolves.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # In-cluster dependencies.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: swarmd-redis
      ports:
        - port: 6379
    # Managed Postgres, inside the VPC. Narrow: the database is at a known
    # address and nothing else in the cluster speaks 5432.
    - to:
        - ipBlock:
            cidr: 10.42.0.0/16          # the VPC CIDR from deploy/terraform
      ports:
        - port: 5432

    # Provider APIs. This USED to be 443-to-anywhere, which was the loosest
    # control shipped and the one docs/PRR.md named as a blocker: it is the
    # path generated code in the sandbox would take to reach the internet if it
    # escaped its subprocess.
    #
    # Now restricted to the published egress ranges of the providers actually
    # in the pool. The list is maintained here rather than discovered, because
    # a NetworkPolicy cannot resolve DNS names -- Kubernetes matches on IP, so
    # a hostname-based rule is not a thing that exists.
    #
    # CONSEQUENCE, stated because it will bite someone: when a provider changes
    # its egress ranges, calls fail with a transport error rather than a 429,
    # the pool records it as an error rather than a rate limit, and every
    # provider eventually looks unhealthy. RUNBOOK.md#providerpoolexhausted
    # lists "egress blocked" as cause 4 for exactly this reason. Verify from
    # inside a pod before assuming the provider is down.
    #
    # These ranges are checked at each capacity-plan review (docs/CAPACITY.md).
    - to:
        # Cloudflare, fronting Groq and OpenRouter.
        - ipBlock: { cidr: 104.16.0.0/13 }
        - ipBlock: { cidr: 172.64.0.0/13 }
        - ipBlock: { cidr: 162.159.0.0/16 }
        # Google APIs, fronting AI Studio / Gemini.
        - ipBlock: { cidr: 142.250.0.0/15 }
        - ipBlock: { cidr: 172.217.0.0/16 }
        - ipBlock: { cidr: 216.58.192.0/19 }
        - ipBlock: { cidr: 34.64.0.0/10 }
        # AWS us-east-1 edge, fronting Cerebras.
        - ipBlock: { cidr: 3.5.0.0/16 }
        - ipBlock: { cidr: 52.84.0.0/15 }
      ports:
        - port: 443
