apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: swarmd-dev

resources:
  - ../../base

# Dev runs one of everything. Two replicas would be honest about production
# shape but doubles free-tier quota contention for no benefit -- ADR-011's
# coordination is still exercised because Redis is in the base.
replicas:
  - name: swarmd-control-plane
    count: 1
  - name: swarmd-frontend
    count: 1

# THE DEPLOYMENT DID NOT START WITHOUT THIS, and it took applying the manifests
# to a real cluster to find out. The control plane is launched with
# `--host 0.0.0.0`, and the app refuses to bind off-host with no operator token
# (ADR-013) -- correctly, since the token is the only thing between the run API
# and anyone who can reach the port. The base Secret ships
# `SWARMD_API_TOKEN: ""` as a placeholder, so every dev apply produced a
# CrashLoopBackOff whose logs said exactly why and which nobody had read.
#
# Prod is unaffected: its ExternalSecret pulls a real token from Secrets
# Manager. Only dev, which uses the placeholder, was broken.
#
# The value is deliberately a fixed, obviously-fake string rather than
# something that looks like a credential. Dev clusters are local and reachable
# only from the developer's machine, so the token's job here is to satisfy the
# guard, not to protect anything -- and a value that ANNOUNCES that is safer
# than a realistic-looking one someone might paste into a shared environment.
# Prod never uses this path; it reads a real token from Secrets Manager.
configMapGenerator:
  - name: swarmd-config
    behavior: merge
    literals:
      - SWARMD_ENV=dev
      - SWARMD_LOG_LEVEL=DEBUG
      # Never in dev: a runaway loop against a paid provider is a bill nobody
      # is watching for. Exhausting free capacity stops the run instead.
      - SWARMD_ALLOW_PAID=false

patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: swarmd-control-plane
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
  - target:
      kind: Secret
      name: swarmd-provider-keys
    patch: |
      - op: replace
        path: /stringData/SWARMD_API_TOKEN
        value: dev-local-only-not-a-real-credential
  - target:
      kind: PodDisruptionBudget
    patch: |
      - op: replace
        path: /spec/minAvailable
        value: 0
