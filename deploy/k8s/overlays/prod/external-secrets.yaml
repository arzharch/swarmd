---
# Provider credentials come from AWS Secrets Manager via the External Secrets
# Operator. The cluster holds a reference, never the value: a Secret committed
# to git is in the history forever, where rotation cannot reach it.
#
# Azure equivalent: swap the SecretStore provider block for `azurekv`. The
# ExternalSecret below is unchanged -- which is the reason for using the
# operator rather than a cloud-specific CSI driver.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        # IRSA: the pod's ServiceAccount is bound to an IAM role. No static
        # AWS credentials exist anywhere in the cluster to be stolen.
        jwt:
          serviceAccountRef:
            name: swarmd
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: swarmd-provider-keys
spec:
  # Re-sync hourly so a rotation in Secrets Manager reaches pods without a
  # deploy. Pods re-read the projected Secret; envFrom values are fixed at
  # container start, so a rotation still needs a restart to take effect --
  # documented in RUNBOOK.md rather than assumed away.
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: swarmd-provider-keys
    creationPolicy: Owner
  data:
    - secretKey: SWARMD_API_TOKEN
      remoteRef: { key: swarmd/prod/providers, property: api_token }
    - secretKey: GROQ_API_KEY
      remoteRef: { key: swarmd/prod/providers, property: groq_api_key }
    - secretKey: GOOGLE_API_KEY
      remoteRef: { key: swarmd/prod/providers, property: google_api_key }
    - secretKey: CEREBRAS_API_KEY
      remoteRef: { key: swarmd/prod/providers, property: cerebras_api_key }
    - secretKey: OPENROUTER_API_KEY
      remoteRef: { key: swarmd/prod/providers, property: openrouter_api_key }
    - secretKey: DATABASE_URL
      remoteRef: { key: swarmd/prod/database, property: url }
